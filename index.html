<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insert Coin — Phase 0 playground</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
      }
      #app {
        border: 1px solid #888;
      }
      #keys {
        white-space: pre-wrap;
        word-break: break-all;
      }
      #log {
        height: 20rem;
        overflow: auto;
        border: 1px solid #888;
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p>
      <label
        >Target:<br />
        <textarea id="target" rows="3" cols="40"></textarea>
      </label>
    </p>
    <p>Status: <strong id="status"></strong></p>
    <p>Mode: <strong id="mode">normal</strong></p>
    <p>
      Keys: <strong id="count">0</strong>
      <button id="reset" type="button">Reset</button>
    </p>
    <pre id="keys"></pre>
    <p>
      <label
        >Forbidden keys (Vim notation, e.g. <code>hjkl&lt;Left&gt;</code>):
        <input id="forbidden"
      /></label>
    </p>
    <p>Key log (newest first):</p>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
