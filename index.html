<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insert Coin</title>
  </head>
  <body>
    <!-- The casing of the device. Texts come from locales/en.json through data-t. -->
    <div class="ic-device">
      <div class="ic-top">
        <p data-t="device.property"></p>
        <!-- Hidden on the game screen with the rest of the top bar. -->
        <p class="ic-support">
          <span data-t="support.text"></span>
          <a
            href="https://ko-fi.com/deafcatsteam"
            target="_blank"
            rel="noopener"
            data-t="support.kofi"
          ></a>
          ·
          <a
            href="https://github.com/sponsors/deafcatsteam"
            target="_blank"
            rel="noopener"
            data-t="support.sponsors"
          ></a>
        </p>
        <div class="ic-pills" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
      <div class="ic-bezel"><main id="app"></main></div>
      <div class="ic-bottom">
        <span class="ic-lens" aria-hidden="true"></span>
        <p data-t="device.lens"></p>
        <div class="ic-speaker" aria-hidden="true">
          <span class="ic-grille"></span><span class="ic-led"></span>
        </div>
        <div class="ic-knobs" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="ic-plate">
          <span class="ic-logo" aria-hidden="true"></span>
          <span data-t="corp.short"></span>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
