name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Schema, i18n keys and replay of every solution. Also part of npm test;
      # kept as its own step so a broken level is easy to spot.
      - run: npm run validate:levels
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # Needs Settings > Pages > Source set to "GitHub Actions" in the repository.
  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
